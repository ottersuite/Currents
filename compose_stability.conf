// Classes the Compose compiler should treat as stable.
//
// These are all immutable data classes, but several hold a List — `PostMedia.assets`,
// `Comment.moreChildren`, `OtterSettings.feedActions` and its filter sets — and the compiler
// infers any class holding a List as unstable. That makes `Post`, `Comment` and `OtterSettings`
// unstable too, which costs value-based skipping in the feed: strong skipping still compares
// them by instance, so a feed restored from the offline cache recomposes every visible row even
// though the deserialized posts are equal to the ones already on screen.
//
// They qualify for this list because nothing mutates them after publication. The repository is
// copy-on-write throughout: every update assigns a freshly built list to the StateFlow rather
// than editing the one collectors already hold.
//
// Declaring these here rather than annotating them keeps `model` free of a Compose dependency,
// which is deliberate - the models store colors as ARGB Longs precisely so they do not have to
// know about Compose or Android.
app.otter.client.model.*
app.otter.client.ui.OtterSettings
app.otter.client.ui.SwipeActionConfig
